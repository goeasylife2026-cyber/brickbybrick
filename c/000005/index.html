
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print City - Contact</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Inter", sans-serif;
}

body {
  min-height: 100vh;
  background: #f8f8f7;
  display: flex;
  justify-content: center;
  padding: 0 0 40px;
}

.wrap {
  width: 100%;
  max-width: 420px;
  padding: 0 24px 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.logo-circle {
  margin-top: 48px;
  width: 150px;
  height: 150px;
  background: #fff200;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,.10);
  border: 1px solid rgba(0,0,0,.08);
}

.logo-circle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

h1 {
  margin-top: 26px;
  font-size: 32px;
  font-weight: 800;
  color: #111;
  letter-spacing: -1px;
}

.sub1 {
  margin-top: 10px;
  font-size: 11px;
  letter-spacing: 3px;
  color: #8a8a8a;
  text-transform: uppercase;
  text-align: center;
}

.sub2 {
  margin-top: 7px;
  font-size: 12px;
  letter-spacing: .8px;
  color: #111;
  text-align: center;
}

.list {
  width: 100%;
  margin-top: 36px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.btn {
  display: flex;
  align-items: center;
  width: 100%;
  background: #fff;
  border: 1px solid #ededed;
  border-radius: 20px;
  padding: 17px 18px;
  text-decoration: none;
  box-shadow: 0 2px 12px rgba(0,0,0,.04);
  transition: .2s ease;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 22px rgba(0,0,0,.08);
}

.icon {
  width: 46px;
  height: 46px;
  min-width: 46px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 700;
  color: white;
}

.whatsapp { background: #25d366; }
.instagram { background: linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045); }
.google {
  background: #fff;
  border: 1px solid #ddd;
  color: #4285f4;
}

.txt {
  margin-left: 14px;
  flex: 1;
  min-width: 0;
}

.title {
  font-size: 15px;
  font-weight: 700;
  color: #111;
}

.subtitle {
  margin-top: 4px;
  font-size: 12.5px;
  color: #8a8a8a;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.arrow {
  margin-left: 10px;
  color: #c8c8c8;
  font-size: 22px;
}

.footer {
  margin-top: 30px;
  text-align: center;
  font-size: 11px;
  color: #a8a8a8;
}

.location {
  margin-top: 7px;
  color: #111;
  font-size: 12px;
  font-weight: 600;
}

.tagline {
  margin-top: 10px;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

@media (max-width:380px) {
  .wrap {
    padding-left: 18px;
    padding-right: 18px;
  }
  h1 { font-size: 29px; }
  .logo-circle {
    width: 130px;
    height: 130px;
  }
}
</style>
</head>
