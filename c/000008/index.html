<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Smart Cafe - Thodupuzha</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#f6f6f7;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
.container{width:100%;max-width:420px}
.logo-wrap{display:flex;justify-content:center;margin:24px 0 20px}
.logo{width:180px;height:180px;object-fit:contain;filter:drop-shadow(0 12px 24px rgba(0,0,0,.15))}
.header{text-align:center;margin-bottom:28px}
.header h1{font-size:26px;font-weight:800;color:#111}
.header p{margin-top:8px;font-size:13px;font-weight:600;letter-spacing:2.5px;color:#888;text-transform:uppercase}
.links{display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border-radius:24px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 20px rgba(0,0,0,.06);border:1px solid #ececec;text-decoration:none;color:#111;transition:.25s;cursor:pointer}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.12)}
.icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px}
.ig1{background:linear-gradient(135deg,#fdf0f3,#ffe4e9)}
.ig2{background:#e6f6f1}
.google{background:#fff9db;border:2px dashed #111}
.text{flex:1}.text b{display:block;font-size:16px}.text span{display:block;font-size:13px;color:#777}
.chev{color:#bbb;font-size:20px}
.footer{text-align:center;margin-top:32px;color:#aaa;font-size:11px;text-transform:uppercase}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#111;color:#fff;padding:12px 20px;border-radius:100px;font-size:13px;opacity:0;transition:.3s;z-index:99}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<div class="container">
  <div class="logo-wrap"><img class="logo" src="logo.png" alt="Apple Smart Cafe"></div>
  <div class="header"><h1>APPLE SMART CAFE</h1><p>The Multibrand Store • Thodupuzha</p></div>
  <div class="links">
    <a class="card" href="https://www.instagram.com/applesmartphonecafe" target="_blank">
      <div class="icon ig1">📸</div><div class="text"><b>Instagram</b><span>@applesmartphonecafe</span></div><div class="chev">›</div>
    </a>
    <div class="card" onclick="copyWA()">
      <div class="icon ig2">💬</div><div class="text"><b>WhatsApp</b><span>Chat - 9061011036</span></div><div class="chev">›</div>
    </div>
    <a class="card" href="https://www.google.com/search?q=applesmartphone+cafe+thosupuzha" target="_blank">
      <div class="icon google">⭐</div><div class="text"><b>Google Review</b><span>Apple Smartphone Cafe - Thodupuzha</span></div><div class="chev">›</div>
    </a>
  </div>
  <div class="footer">Apple Smart Cafe • Thodupuzha • 9061011036</div>
</div>
<div id="toast" class="toast"></div>
<script>
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function copyWA(){navigator.clipboard.writeText('9061011036').then(()=>{showToast('Copied: 9061011036'); window.open('https://wa.me/919061011036','_blank')}).catch(()=>{window.open('https://wa.me/919061011036','_blank')})}
</script>
</body>
</html>
