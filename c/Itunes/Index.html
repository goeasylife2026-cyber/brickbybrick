<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iTunes Solution</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#fafafa;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  color:#111;
  -webkit-font-smoothing:antialiased;
}
.container{
  max-width:390px;
  margin:0 auto;
  padding:32px 18px 30px;
  text-align:center;
}
.logo-wrap{
  width:168px;
  height:168px;
  margin:0 auto 22px;
  border-radius:50%;
  padding:4px;
  background:#111;
  box-shadow:0 6px 20px rgba(0,0,0,.15);
}
.logo{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  display:block;
  background:#fff;
  border:4px solid #fff;
}
h1{
  font-size:32px;
  font-weight:800;
  letter-spacing:-0.5px;
  margin:0 0 12px;
  text-transform:uppercase;
}
.tagline{
  color:#8a8a8a;
  font-size:11.5px;
  letter-spacing:3.2px;
  font-weight:500;
  text-transform:uppercase;
  margin-bottom:8px;
}
.subtitle{
  font-size:13.5px;
  color:#111;
  margin-bottom:28px;
  letter-spacing:0.3px;
}
.cards{display:flex;flex-direction:column;gap:14px;text-align:left}
.card{
  height:76px;
  background:#fff;
  border:1px solid #f0f0f0;
  border-radius:20px;
  display:flex;
  align-items:center;
  padding:14px 16px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
  text-decoration:none;
  color:#111;
  transition:transform .15s ease, box-shadow .15s ease;
}
.card:active{transform:scale(.97)}
.icon{
  width:48px;
  height:48px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.whatsapp{background:#12d86a}
.instagram{background:radial-gradient(130% 130% at 30% 30%,#feda75 0%,#fa7e1e 20%,#d62976 50%,#962fbf 80%,#4f5bd5 100%)}
.google{background:#fff;border:1px solid #e8e8e8}
.info{margin-left:14px;flex:1}
.title{font-size:15.5px;font-weight:700;margin-bottom:2px;line-height:1.2}
.detail{color:#8a8a8a;font-size:12.5px}
.arrow{
  width:20px;
  height:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#bbb;
  font-size:18px;
  margin-left:8px;
}
.footer{
  margin-top:36px;
  text-align:center;
}
.footer-top{
  font-size:10.5px;
  letter-spacing:3px;
  color:#9a9a9a;
  margin-bottom:10px;
  text-transform:uppercase;
}
.location{
  font-size:13px;
  font-weight:600;
  margin-bottom:10px;
}
.copy{
  font-size:11.5px;
  color:#aaa;
}
</style>
</head>
