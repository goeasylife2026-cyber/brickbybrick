  justify-content:center;
  align-items:center;

  font-weight:bold;
}

h1{
  font-size:21px;
  margin:14px 0 5px;
}

.sub{
  color:#777;
  font-size:14px;
  margin-bottom:12px;
}

.stars{
  font-size:27px;
  margin:12px;
}

.language{

  margin-bottom:12px;

.language button{

  margin:0;
  padding:10px 5px;
  font-size:13px;
  background:#eee;
  color:#333;

button{
  width:100%;

  border-radius:11px;
  padding:14px;

  font-size:15px;

}

.generate{

  color:white;
}

.copy{

  color:#1967d2;
}

.google{
  background:#4285f4;

}

textarea{
  width:100%;
  min-height:170px;
  resize:vertical;
  border:1px solid #ddd;
  border-radius:12px;
  padding:13px;
  font-size:15px;
  line-height:1.5;
  outline:none;
}

textarea:focus{
  border-color:#4285f4;
}

.success{
  display:none;
  color:green;
  font-size:13px;
  margin-top:9px;
}

.note{
  margin-top:16px;
  color:#777;
  font-size:11px;
  line-height:1.5;
}

<body>

<div class="container">

  <div class="logo">IC</div>

  <h1>i Core Mobile Service Center</h1>

  <div class="sub">Thodupuzha</div>

  <div class="stars">⭐⭐⭐⭐⭐</div>

  <div class="language">
    <button onclick="setLanguage('english')">English</button>
    <button onclick="setLanguage('malayalam')">മലയാളം</button>
    <button onclick="setLanguage('manglish')">Manglish</button>
  </div>

  <button class="generate" onclick="generateReview()">
    ✨ Generate Review
  </button>

  <br><br>

  <textarea id="review"
  placeholder="Generated review will appear here..."></textarea>

  <button class="copy" onclick="copyReview()">
    📋 Copy Review
  </button>

  <div class="success" id="success">
    ✅ Review copied!
  </div>

  <button class="google" onclick="openGoogle()">
    ⭐ Open Google Review
  </button>

  <div class="note">
    Please edit the draft so it accurately reflects your own
    experience before posting your review.

</div>

/* -------------------------
   RANDOM FUNCTION
------------------------- */

function randomItem(array){
  return array[Math.floor(Math.random()*array.length)];
}


/* -------------------------
   GENERATE
------------------------- */

function generateReview(){

  let text = "";

  if(currentLanguage === "english"){

    text =
      randomItem(englishStart) + " " +
      randomItem(englishMiddle) + " " +
      randomItem(englishWork) + " " +
      randomItem(englishEnd);

  }

  else if(currentLanguage === "malayalam"){

    text =
      randomItem(malayalamStart) + " " +
      randomItem(malayalamMiddle) + " " +
      randomItem(malayalamEnd);

  }

  else{

    text =
      randomItem(manglishStart) + " " +
      randomItem(manglishMiddle) + " " +
      randomItem(manglishEnd);

  }

  document.getElementById("review").value = text;

  document.getElementById("success").style.display = "none";
}


/* -------------------------
   COPY
------------------------- */

function copyReview(){

  const text =
    document.getElementById("review").value.trim();

  if(!text){
    alert("Generate a review first.");
    return;
  }

  navigator.clipboard.writeText(text)
  .then(function(){

    document.getElementById("success").style.display="block";

    setTimeout(function(){
      document.getElementById("success").style.display="none";
    },2500);

  })
  .catch(function(){

    const box =
      document.getElementById("review");

    box.select();

    document.execCommand("copy");

    alert("Review copied!");

  });
}
