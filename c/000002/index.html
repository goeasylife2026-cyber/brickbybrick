<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>iCORE | Mobile Service Centre</title>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#f8f8f7;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:0 0 40px;
}

.wrap{
    width:100%;
    max-width:420px;
    padding:48px 24px 32px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.logo{
    width:120px;
    height:120px;
    background:white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 20px 60px rgba(0,0,0,.08);
    border:1px solid #eee;
    margin-bottom:28px;
}

.logo span{
    font-size:38px;
    font-weight:700;
    color:#111;
}

h1{
    font-size:32px;
    color:#111;
    font-weight:700;
}

.sub1{
    margin-top:10px;
    font-size:11px;
    letter-spacing:3px;
    color:#888;
    text-transform:uppercase;
}

.sub2{
    margin-top:6px;
    font-size:12px;
    letter-spacing:1px;
    color:#111;
    font-weight:500;
}

.list{
    width:100%;
    margin-top:36px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.btn{
    display:flex;
    align-items:center;
    width:100%;
    background:#fff;
    border:1px solid #eee;
    border-radius:20px;
    padding:18px 20px;
    text-decoration:none;
    box-shadow:0 2px 12px rgba(0,0,0,.04);
    transition:.25s;
}

.btn:hover{
    border-color:#111;
    transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(0,0,0,.08);
}
