.copy{

.google{

  padding:13px;

  line-height:1.5;

textarea:focus{

.success{

  font-size:13px;
  margin-top:9px;
  font-weight:bold;

/* =========================================
   RANDOM ITEM
========================================= */

function randomItem(array){

  return array[
    Math.floor(Math.random() * array.length)
  ];

}


/* =========================================
   SET LANGUAGE
========================================= */

function setLanguage(language){

  currentLanguage = language;

  generateReview();

}


/* =========================================
   GENERATE REVIEW
========================================= */

function generateReview(){

  let text = "";


  /* English */

  if(currentLanguage === "english"){

    text =
      randomItem(englishStart) + " " +
      randomItem(englishMiddle) + " " +
      randomItem(englishWork) + " " +
      randomItem(englishEnd);

  }


  /* Malayalam */

  else if(currentLanguage === "malayalam"){

    text =
      randomItem(malayalamStart) + " " +
      randomItem(malayalamMiddle) + " " +
      randomItem(malayalamEnd);

  }


  /* Manglish */

  else{

    text =
      randomItem(manglishStart) + " " +
      randomItem(manglishMiddle) + " " +
      randomItem(manglishEnd);

  }


  document.getElementById("review").value = text;

  document.getElementById("success").style.display = "none";

}


/* =========================================
   COPY REVIEW
========================================= */

function copyReview(){

  const text =
    document.getElementById("review").value.trim();


  if(!text){

    alert("Please generate or write a review first.");

    return;

  }


  navigator.clipboard.writeText(text)

  .then(function(){

    document.getElementById("success")
      .style.display = "block";


    setTimeout(function(){

      document.getElementById("success")
        .style.display = "none";

    },2500);

  })


  .catch(function(){

    const box =
      document.getElementById("review");

    box.select();

    document.execCommand("copy");

    alert("Review copied!");

  });

}


/* =========================================
   DIRECT GOOGLE REVIEW LINK
========================================= */

function openGoogle(){

  const googleReviewLink =
    "https://search.google.com/local/writereview?placeid=ChIJ-Ru7U3HFBzsRRcq5VL1mHWM";


  window.open(
    googleReviewLink,
    "_blank"
  );

}
