<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Apple Smart Cafe - Thodupuzha</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;background:#f6f6f7;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
.container{width:100%;max-width:420px}
.logo-wrap{display:flex;justify-content:center;margin:24px 0 20px}
.logo{width:180px;height:180px;object-fit:cover;border-radius:50%;filter:drop-shadow(0 12px 24px rgba(0,0,0,.20));transition:transform .3s ease}
.logo:hover{transform:scale(1.05)}
.header{text-align:center;margin-bottom:28px}
.header h1{font-size:26px;font-weight:800;letter-spacing:-.5px;color:#111;line-height:1.1}
.header p{margin-top:8px;font-size:13px;font-weight:600;letter-spacing:2.5px;color:#888;text-transform:uppercase}
.links{display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border-radius:24px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 20px rgba(0,0,0,.06);border:1px solid #ececec;text-decoration:none;color:#111;transition:all .25s ease;cursor:pointer}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.12)}
.card:active{transform:scale(.98)}
.icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.ig1{background:linear-gradient(135deg,#fdf0f3,#ffe4e9)}
.ig2{background:#e6f6f1}
.google{background:#fff9db;border:2px dashed #111}
.text{flex:1;min-width:0}
.text b{display:block;font-size:16px;font-weight:700}
.text span{display:block;margin-top:4px;font-size:13px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{font-size:28px;color:#aaa;line-height:1}
.footer{text-align:center;margin-top:28px;font-size:12px;color:#999}
</style>
</head>
