<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,sans-serif}
body{background:#F8F8F7;min-height:100vh;display:flex;justify-content:center;padding:0 0 40px}
.wrap{width:100%;max-width:420px;padding:0 24px 32px;display:flex;flex-direction:column;align-items:center}
.logo-circle{margin-top:48px;width:120px;height:120px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 60px rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.06);overflow:hidden}
.logo-circle img{width:100%;height:100%;object-fit:cover;padding:0}
h1{margin-top:28px;font-size:28px;font-weight:800;letter-spacing:-.5px;color:#111;text-transform:uppercase}
.sub1{margin-top:10px;font-size:11px;letter-spacing:3px;color:#8A8A8A;text-transform:uppercase;font-weight:500}
.sub2{margin-top:6px;font-size:12px;letter-spacing:.8px;color:#111;font-weight:600}
.list{width:100%;margin-top:36px;display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;width:100%;background:#fff;border:1px solid #EFEFEF;border-radius:20px;padding:18px 20px;text-decoration:none;box-shadow:0 2px 12px rgba(0,0,0,.04);transition:all .25s}
.btn:hover{border-color:#111;box-shadow:0 8px 24px rgba(0,0,0,.08);transform:translateY(-1px)}
.icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.txt{margin-left:14px;flex:1;min-width:0}.title{font-size:15px;font-weight:600;color:#111}.subtitle{font-size:12.5px;color:#8A8A8A;margin-top:2px}.arrow{margin-left:12px;color:#C8C8C8;font-size:22px}.footer{margin-top:36px;font-size:11px;color:#A8A8A8}
</style></head><body>
