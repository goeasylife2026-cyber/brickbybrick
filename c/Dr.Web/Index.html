<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DR Mobile</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
body{
    background:#fff;
    color:#111;
}
.container{
    max-width:500px;
    margin:auto;
    padding:25px 18px;
}
.header{
    text-align:center;
    padding:25px 0 35px;
}
.logo{
    font-size:42px;
    font-weight:800;
    letter-spacing:-3px;
}
.shop-name{
    font-size:16px;
    color:#777;
    margin-top:5px;
}
.subtitle{
    margin-top:25px;
    font-size:14px;
    color:#888;
}
.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}
.option{
    background:#fff;
    border:1px solid #e5e5e5;
    border-radius:18px;
    padding:30px 15px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
    transition:.2s;
}
.option:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 25px rgba(0,0,0,.1);
}
.icon{
    font-size:32px;
    margin-bottom:12px;
}
.option h3{
    font-size:17px;
}
.section{
    display:none;
    margin-top:25px;
}
.section.active{
    display:block;
}
.back{
    border:0;
    background:none;
    color:#777;
    margin-bottom:18px;
    cursor:pointer;
    font-size:14px;
}
label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:8px;
}
input{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    font-size:15px;
    background:#fff;
}
input:focus{
    border-color:#111;
}
.result{
    margin-top:20px;
    padding:20px;
    border:1px solid #e5e5e5;
    border-radius:16px;
    box-shadow:0 5px 18px rgba(0,0,0,.05);
    display:none;
}
.result h3{
    margin-bottom:15px;
}
.row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #eee;
}
.btn-group{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:18px;
}
.whatsapp,.call{
    display:block;
    text-align:center;
    padding:14px;
    border-radius:12px;
    font-weight:600;
    text-decoration:none;
}
.whatsapp{
    background:#25D366;
    color:#fff;
}
.call{
    background:#111;
    color:#fff;
}
.parts-message{
    padding:20px;
    border:1px solid #e5e5e5;
    border-radius:16px;
    text-align:center;
    color:#666;
}
.contact-bar{
    text-align:center;
    margin-top:30px;
    padding-top:20px;
    border-top:1px solid #eee;
}
.contact-bar a{
    color:#111;
    font-weight:600;
    text-decoration:none;
    margin:0 10px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">DR</div>
        <div class="shop-name">DR Mobile</div>
        <div class="subtitle">Select a service</div>
    </div>

    <div class="options" id="mainOptions">
        <div class="option" onclick="showDisplay()">
            <div class="icon">📱</div>
            <h3>Display</h3>
        </div>
        <div class="option" onclick="showParts()">
            <div class="icon">🔧</div>
            <h3>Spare Parts</h3>
        </div>
    </div>

    <!-- DISPLAY SECTION -->
    <div class="section" id="displaySection">
        <button class="back" onclick="goBack()">← Back</button>

        <label>Select / Enter Phone Model</label>
        <input list="models" id="model" placeholder="Example: Vivo Y20" oninput="checkModel()">

        <datalist id="models">
            <option value="Vivo Y20">
            <option value="Vivo Y31">
            <option value="Oppo A31">
            <option value="Oppo A15">
            <option value="Oppo F19">
            <option value="Realme C21Y">
        </datalist>

        <div class="result" id="result">
            <h3 id="modelName"></h3>
            <div class="row">
                <span>Display</span>
                <strong id="displayType"></strong>
            </div>
            <div class="row">
                <span>Stock</span>
                <strong id="stock"></strong>
            </div>
            <div class="row">
                <span>Rate</span>
                <strong id="rate"></strong>
            </div>

            <div class="btn-group">
                <a id="whatsapp" class="whatsapp" target="_blank" href="#">WhatsApp</a>
                <a id="callbtn" class="call" href="tel:+917907930656">Call Now</a>
            </div>
        </div>
    </div>

    <!-- SPARE PARTS -->
    <div class="section" id="partsSection">
        <button class="back" onclick="goBack()">← Back</button>
        <div class="parts-message">
            <h3>Spare Parts</h3>
            <p style="margin-top:10px;">
                Please enter the phone model and contact us on WhatsApp or Call.
            </p>
            <div class="btn-group">
                <a class="whatsapp" target="_blank" href="https://wa.me/917907930656?text=Hi%20DR%20Mobile%2C%20I%20need%20spare%20parts.">WhatsApp Enquiry</a>
                <a class="call" href="tel:+917907930656">Call Now</a>
            </div>
        </div>
    </div>

    <div class="contact-bar">
        <a href="tel:+917907930656">📞 7907930656</a> |
        <a href="https://wa.me/917907930656" target="_blank">💬 WhatsApp</a>
    </div>

</div>

<script>
const stockData = {
    "vivo y20": { display: "Display Combo", stock: "Available", rate: "₹800" },
    "vivo y31": { display: "Display Combo", stock: "Available", rate: "₹850" },
    "oppo a31": { display: "Display Combo", stock: "Available", rate: "₹800" },
    "oppo a15": { display: "Display Combo", stock: "Available", rate: "₹800" },
    "oppo f19": { display: "Display Combo", stock: "Available", rate: "₹850" },
    "realme c21y": { display: "Display Combo", stock: "Available", rate: "₹800" }
};

function showDisplay(){
    document.getElementById("mainOptions").style.display="none";
    document.getElementById("displaySection").classList.add("active");
}
function showParts(){
    document.getElementById("mainOptions").style.display="none";
    document.getElementById("partsSection").classList.add("active");
}
function goBack(){
    document.getElementById("mainOptions").style.display="grid";
    document.getElementById("displaySection").classList.remove("active");
    document.getElementById("partsSection").classList.remove("active");
}
function checkModel(){
    let inputRaw = document.getElementById("model").value.trim();
    let input = inputRaw.toLowerCase();
    let result = document.getElementById("result");

    if(stockData[input]){
        let data = stockData[input];
        document.getElementById("modelName").innerText = inputRaw.toUpperCase();
        document.getElementById("displayType").innerText = data.display;
        document.getElementById("stock").innerText = data.stock;
        document.getElementById("rate").innerText = data.rate;

        let message = `Hi DR Mobile,\n\nI need display for: ${inputRaw.toUpperCase()}\nDisplay: ${data.display}\nRate: ${data.rate}\nStock: ${data.stock}`;

        document.getElementById("whatsapp").href = "https://wa.me/917907930656?text=" + encodeURIComponent(message);
        result.style.display="block";
    } else {
        result.style.display="none";
    }
}
</script>

</body>
</html>
