<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doctor Mobile</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}

header{
    background:#111;
    color:white;
    text-align:center;
    padding:28px 15px;
}

header h1{
    margin:0;
    font-size:30px;
}

header p{
    margin:8px 0 0;
    color:#ccc;
}

.container{
    max-width:600px;
    margin:auto;
    padding:20px;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.option{
    background:white;
    border-radius:18px;
    padding:30px 15px;
    text-align:center;
    box-shadow:0 5px 18px rgba(0,0,0,.1);
    cursor:pointer;
    transition:.2s;
}

.option:active{
    transform:scale(.97);
}

.option .icon{
    font-size:45px;
}

.option h2{
    margin:12px 0 0;
    font-size:19px;
}

.section{
    display:none;
    margin-top:25px;
    background:white;
    padding:20px;
    border-radius:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.1);
}

.section h2{
    margin-top:0;
}

select{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    background:white;
}

.result{
    display:none;
    margin-top:18px;
    padding:18px;
    border-radius:14px;
    background:#f5f5f5;
}

.result h3{
    margin-top:0;
}

.info{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid #ddd;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.btn{
    flex:1;
    padding:13px;
    border-radius:10px;
    text-align:center;
    text-decoration:none;
    color:white;
    font-weight:bold;
}

.call{
    background:#1677ff;
}

.whatsapp{
    background:#25d366;
}

.back{
    margin-top:15px;
    width:100%;
    padding:12px;
    border:0;
    border-radius:10px;
    background:#222;
    color:white;
    cursor:pointer;
}

footer{
    text-align:center;
    padding:30px;
    color:#777;
    font-size:13px;
}
</style>
</head>

<body>

<header>
    <h1>Doctor Mobile</h1>
    <p>Mobile Display & Spare Parts</p>
</header>

<div class="container">

    <!-- MAIN OPTIONS -->
    <div class="options" id="mainOptions">

        <div class="option" onclick="showSection('displaySection')">
            <div class="icon">📱</div>
            <h2>Display</h2>
        </div>

        <div class="option" onclick="showSection('partsSection')">
            <div class="icon">🔧</div>
            <h2>Spare Parts</h2>
        </div>

    </div>


    <!-- DISPLAY SECTION -->
    <div class="section" id="displaySection">

        <h2>📱 Select Display Model</h2>

        <select onchange="showDisplay()" id="displaySelect">
            <option value="">Select Model</option>

            <option value="Oppo A3s|750|2">Oppo A3s</option>
            <option value="Oppo A31|800|4">Oppo A31</option>
            <option value="Oppo A5s|750|2">Oppo A5s</option>
            <option value="Oppo A57 New|800|4">Oppo A57 New</option>
            <option value="Oppo A15|800|5">Oppo A15</option>
            <option value="Oppo A1K|750|4">Oppo A1K</option>
            <option value="Oppo F19|850|6">Oppo F19</option>
            <option value="Realme C21Y|800|7">Realme C21Y</option>
            <option value="Vivo Y31|850|5">Vivo Y31</option>
            <option value="Vivo Y20|800|6">Vivo Y20</option>
            <option value="Vivo Y90|750|3">Vivo Y90</option>

        </select>

        <div class="result" id="displayResult">

            <h3 id="displayModel"></h3>

            <div class="info">
                <span>Price</span>
                <strong>₹<span id="displayPrice"></span></strong>
            </div>

            <div class="info">
                <span>Stock</span>
                <strong id="displayStock"></strong>
            </div>

            <div class="buttons">

                <a class="btn call"
                   href="tel:+9179079 30656">
                    ☎️ Call
                </a>

                <a class="btn whatsapp"
                   id="displayWhatsApp"
                   href="#"
                   target="_blank">
                    WhatsApp
                </a>

            </div>

        </div>

        <button class="back" onclick="goBack()">
            ← Back
        </button>

    </div>


    <!-- SPARE PARTS SECTION -->
    <div class="section" id="partsSection">

        <h2>🔧 Select Spare Part</h2>

        <select onchange="showPart()" id="partSelect">

            <option value="">Select Spare Part</option>

            <option value="Charging Port|300|5">
                Charging Port
            </option>

            <option value="Battery|500|8">
                Battery
            </option>

            <option value="Speaker|250|6">
                Speaker
            </option>

            <option value="Mic|200|5">
                Mic
            </option>

            <option value="Power Button|150|4">
                Power Button
            </option>

            <option value="Volume Button|150|3">
                Volume Button
            </option>

        </select>


        <div class="result" id="partResult">

            <h3 id="partName"></h3>

            <div class="info">
                <span>Price</span>
                <strong>₹<span id="partPrice"></span></strong>
            </div>

            <div class="info">
                <span>Stock</span>
                <strong id="partStock"></strong>
            </div>

            <div class="buttons">

                <a class="btn call"
                   href="tel:+917907930656">
                    ☎️ Call
                </a>

                <a class="btn whatsapp"
                   id="partWhatsApp"
                   href="#"
                   target="_blank">
                    WhatsApp
                </a>

            </div>

        </div>

        <button class="back" onclick="goBack()">
            ← Back
        </button>

    </div>

</div>

<footer>
    © 2026 Doctor Mobile
</footer>


<script>

function showSection(section){

    document.getElementById("mainOptions").style.display="none";

    document.getElementById("displaySection").style.display="none";
    document.getElementById("partsSection").style.display="none";

    document.getElementById(section).style.display="block";
}


function goBack(){

    document.getElementById("displaySection").style.display="none";
    document.getElementById("partsSection").style.display="none";

    document.getElementById("mainOptions").style.display="grid";
}


function showDisplay(){

    let value=document.getElementById("displaySelect").value;

    if(!value){
        document.getElementById("displayResult").style.display="none";
        return;
    }

    let data=value.split("|");

    let model=data[0];
    let price=data[1];
    let stock=data[2];

    document.getElementById("displayModel").innerText=model;
    document.getElementById("displayPrice").innerText=price;
    document.getElementById("displayStock").innerText=stock+" Available";

    let message=
        "Hello Doctor Mobile, I need "+model+
        " display. Price: ₹"+price+
        ". Stock: "+stock;

    document.getElementById("displayWhatsApp").href=
        "https://wa.me/919847864143?text="+encodeURIComponent(message);

    document.getElementById("displayResult").style.display="block";
}


function showPart(){

    let value=document.getElementById("partSelect").value;

    if(!value){
        document.getElementById("partResult").style.display="none";
        return;
    }

    let data=value.split("|");

    let part=data[0];
    let price=data[1];
    let stock=data[2];

    document.getElementById("partName").innerText=part;
    document.getElementById("partPrice").innerText=price;
    document.getElementById("partStock").innerText=stock+" Available";

    let message=
        "Hello Doctor Mobile, I need "+part+
        ". Price: ₹"+price+
        ". Stock: "+stock;

    document.getElementById("partWhatsApp").href=
        "https://wa.me/919847864143?text="+encodeURIComponent(message);

    document.getElementById("partResult").style.display="block";
}

</script>

</body>
</html>
