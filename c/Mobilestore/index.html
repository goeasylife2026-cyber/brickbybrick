<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>Mobile Store</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#050505;color:#fff}
body{display:flex;justify-content:center;align-items:center;padding:22px}
.card{width:100%;max-width:430px;min-height:calc(100vh - 44px);display:flex;flex-direction:column;justify-content:center;text-align:center;
background:linear-gradient(145deg,#111 0%,#050505 55%,#160000 100%);
border:1px solid #292929;border-radius:28px;padding:28px 20px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.logo{width:min(92%,350px);height:auto;margin:0 auto 12px;display:block;border-radius:18px}
.tag{color:#bbb;font-size:14px;letter-spacing:2px;margin:4px 0 26px;text-transform:uppercase}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:16px 18px;margin:10px 0;
border-radius:15px;text-decoration:none;font-size:17px;font-weight:700;transition:.2s;box-shadow:0 7px 18px rgba(0,0,0,.3)}
.btn:active{transform:scale(.98)}
.whatsapp{background:#25D366;color:#071b0d}
.instagram{background:linear-gradient(90deg,#833ab4,#fd1d1d,#fcb045);color:#fff}
.location{background:#fff;color:#111}
.icon{font-size:24px;line-height:1}
.footer{margin-top:24px;color:#777;font-size:12px}
</style>
</head>
