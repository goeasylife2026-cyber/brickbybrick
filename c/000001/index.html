<!DOCTYPE html>

<head>

  rel="stylesheet"

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#020504;
  color:#ffffff;
  font-family:Arial,Helvetica,sans-serif;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:20px;
}


/* =========================
   MAIN CARD
========================= */

.card{
  width:100%;
  max-width:1100px;

  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 20% 35%,
      rgba(20,100,65,.28),
      transparent 30%
    ),
    linear-gradient(
      135deg,
      #020807,
      #001b12 55%,
      #003b25
    );

  border:2px solid #c99a32;
  border-radius:32px;

  padding:42px 55px 25px;

  box-shadow:
    0 0 30px rgba(201,154,50,.18),
    inset 0 0 80px rgba(0,0,0,.75);
}


/* Decorative green curve */

.card::before{
  content:"";

  position:absolute;

  width:700px;
  height:700px;

  right:-350px;
  top:-370px;

  background:
    linear-gradient(
      135deg,
      rgba(15,91,61,.9),
      rgba(0,35,22,.2)
    );

  border:2px solid rgba(201,154,50,.65);

  border-radius:50%;

  transform:rotate(20deg);
}

.card::after{
  content:"";

  position:absolute;

  width:650px;
  height:650px;

  right:-320px;
  top:-350px;

  border:1px solid rgba(201,154,50,.45);

  border-radius:50%;

  transform:rotate(20deg);
}


/* =========================
   CONTENT
========================= */

.content{
  position:relative;
  z-index:2;
}


/* =========================
   BRICK BY BRICK LOGO
========================= */

.brand{
  display:flex;
  align-items:center;

  gap:14px;

  color:#e5b94f;

  font-size:25px;
  font-weight:bold;

  letter-spacing:1px;

  margin-bottom:35px;
}

.brick-logo{
  width:48px;
  height:42px;

  position:relative;
}

.brick-logo span{
  position:absolute;

  width:13px;
  height:10px;

  background:#e5b94f;

  border-radius:2px;
}

.b1{left:0;top:0}
.b2{left:17px;top:0}
.b3{left:34px;top:0}
.b4{left:8px;top:15px}
.b5{left:25px;top:15px}
.b6{left:0;top:30px}
.b7{left:17px;top:30px}
.b8{left:34px;top:30px}


/* =========================
   PROFILE
========================= */

.profile{
  display:flex;
  align-items:center;

  gap:75px;
}

.avatar{
  width:210px;
  height:210px;

  flex-shrink:0;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:76px;
  font-weight:bold;

  color:#f2d27a;

  background:
    radial-gradient(
      circle,
      #082b20,
      #02100c
    );

  border:5px solid #d3a83e;

  box-shadow:
    0 0 0 8px rgba(211,168,62,.08),
    0 0 25px rgba(211,168,62,.3);
}


.details h1{
  font-size:55px;
  line-height:1.05;

  margin-bottom:14px;
}

.company{
  font-size:28px;
  color:#e4b64b;
}

.line{
  width:90px;
  height:4px;

  background:#d6aa3d;

  margin-top:28px;

  border-radius:10px;
}


/* =========================
   ACTION BUTTONS
========================= */

.actions{
  margin-top:45px;

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:20px;
}

.action{
  text-decoration:none;

  color:#ffffff;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:10px;
}

.icon{
  width:82px;
  height:82px;

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:36px;

  color:#f1c75b;

  background:
    radial-gradient(
      circle at 35% 30%,
      #12623e,
      #00281a
    );

  border:2px solid #b99337;

  box-shadow:
    inset 0 0 20px rgba(0,0,0,.4),
    0 0 15px rgba(201,154,50,.12);

  transition:.25s;
}

.action span{
  font-size:19px;
}

.action:hover .icon{
  transform:
    translateY(-5px)
    scale(1.05);

  box-shadow:
    0 0 22px
    rgba(224,180,70,.45);
}


/* =========================
   CONTACT PANEL
========================= */

.contact-panel{
  margin-top:35px;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  background:
    rgba(0,30,20,.78);

  border:
    1px solid
    rgba(190,170,80,.55);

  border-radius:20px;

  overflow:hidden;
}

.contact{
  padding:25px 30px;

  border-right:
    1px solid
    rgba(190,170,80,.45);
}

.contact:last-child{
  border-right:none;
}

.contact-title{
  color:#e4b64b;

  font-size:20px;

  margin-bottom:15px;
}

.contact-value{
  font-size:20px;

  word-break:break-word;
}


/* =========================
   FOOTER
========================= */

.footer{
  margin-top:30px;

  display:flex;

  justify-content:center;
  align-items:center;

  gap:18px;

  color:#e4b64b;

  font-size:21px;
}

.dot{
  width:10px;
  height:10px;

  background:#e4b64b;

  border-radius:50%;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  body{

  }

  .card{

}


/* =========================

========================= */

@media(max-width:500px){

    font-size:11px;

  .contact-title{
    font-size:12px;
  }

  .contact-value{
    font-size:11px;
  }
}

</style>

<!-- =========================
     SAVE CONTACT SCRIPT
========================= -->

<script>

document
.getElementById("saveContact")
.addEventListener("click", function(e){

  e.preventDefault();


  const vcard =
`BEGIN:VCARD
VERSION:3.0
FN:Shamsudheen Latheef
ORG:Poonawalla Fincorp
TEL;TYPE=CELL:+919645741683
EMAIL:go.easylife2026@gmail.com
URL:https://www.instagram.com/_go_easy_/
NOTE:Brick by Brick - Card #000001
END:VCARD`;


  const blob =
    new Blob(
      [vcard],
      {type:"text/vcard"}
    );


  const url =
    URL.createObjectURL(blob);


  const link =
    document.createElement("a");


  link.href = url;

  link.download =
    "Shamsudheen-Latheef-Card-000001.vcf";


  document
    .body
    .appendChild(link);


  link.click();


  document
    .body
    .removeChild(link);


  URL.revokeObjectURL(url);

});

</script>
