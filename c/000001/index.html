<title>Shamsudheen Latheef | Brick by Brick</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --green-dark: #061b16;
  --green: #0d3025;
  --green-light: #164b3a;
  --gold: #d6b45c;
  --gold-light: #f0d98a;
  --white: #ffffff;
  --text-light: #e9eee9;
  --muted: #b8c8c0;
  --border: rgba(214,180,92,0.45);
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background:
    radial-gradient(circle at top right, #174c3a 0%, transparent 35%),
    linear-gradient(145deg, #020b08, #09241b 55%, #03100c);
  color: var(--white);
  display: flex;
  justify-content: center;
  padding: 20px 12px;
}

.card {
  width: 100%;
  max-width: 520px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 28px;
  background: rgba(5, 22, 17, 0.96);
  box-shadow:
    0 20px 60px rgba(0,0,0,0.55),
    0 0 35px rgba(214,180,92,0.08);
}

/* TOP */
.top {
  padding: 32px 22px 28px;
  text-align: center;
  background:
    radial-gradient(circle at 80% 10%, rgba(214,180,92,0.14), transparent 35%),
    linear-gradient(145deg, #071c16, #0c3024);
  border-bottom: 1px solid var(--border);
}

.brand {
  color: var(--gold-light);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 2px;
  margin-bottom: 25px;
}

.avatar {
  width: 115px;
  height: 115px;
  margin: 0 auto 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  font-weight: 700;
  color: var(--gold-light);
  background: #0b2a20;
  border: 3px solid var(--gold);
  box-shadow:
    0 0 0 7px rgba(214,180,92,0.08),
    0 0 30px rgba(214,180,92,0.15);
}

h1 {
  margin: 0;
  font-size: 31px;
  line-height: 1.15;
  color: #fff;
}

.company {
  margin-top: 10px;
  font-size: 18px;
  color: var(--gold-light);
}

/* CONTENT */
.content {
  padding: 25px 20px 30px;
}

/* BUTTONS */
.buttons {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.button {
  min-height: 58px;
  padding: 12px 10px;
  border-radius: 16px;
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 16px;
  font-weight: 700;
  color: var(--white);
  background: #0d2c22;
  border: 1px solid rgba(214,180,92,0.35);
  transition: 0.2s ease;
}

.button:hover {
  transform: translateY(-2px);
  border-color: var(--gold);
}

.button.primary {
  background: linear-gradient(135deg, #a98532, #e0c56d);
  color: #08150f;
  border: none;
}

.button.full {
  grid-column: 1 / -1;
}

.icon {
  font-size: 22px;
}

/* DETAILS */
.details {
  margin-top: 28px;
  padding: 20px;
  border-radius: 18px;
  background: rgba(14,53,40,0.72);
  border: 1px solid rgba(214,180,92,0.25);
}

.detail {
  display: flex;
  gap: 14px;
  padding: 13px 0;
  border-bottom: 1px solid rgba(214,180,92,0.15);
}

.detail:last-child {
  border-bottom: none;
}

.detail-icon {
  width: 32px;
  flex-shrink: 0;
  color: var(--gold-light);
  font-size: 20px;
}

.detail-label {
  display: block;
  color: var(--gold-light);
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.detail-value {
  color: #fff;
  font-size: 15px;
  word-break: break-word;
}

/* THEME SWITCHER */
.theme-section {
  margin-top: 28px;
  padding-top: 22px;
  border-top: 1px solid rgba(214,180,92,0.18);
}

.theme-title {
  text-align: center;
  color: var(--gold-light);
  font-size: 13px;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 14px;
}

.themes {
  display: flex;
  justify-content: center;
  gap: 10px;
}

.theme-btn {
  flex: 1;
  padding: 11px 7px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.18);
  background: #10251f;
  color: white;
  font-size: 12px;
  cursor: pointer;
}

.theme-btn.active {
  border-color: var(--gold);
  color: var(--gold-light);
  box-shadow: 0 0 12px rgba(214,180,92,0.15);
}

/* FOOTER */
.footer {
  padding: 18px;
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  border-top: 1px solid rgba(214,180,92,0.18);
}

.footer strong {
  color: var(--gold-light);
}

/* RESPONSIVE */
@media (max-width: 400px) {
  h1 {
    font-size: 27px;
  }

  .buttons {
    grid-template-columns: 1fr;
  }

  .button.full {
    grid-column: auto;
  }
}
</style>
</head>
