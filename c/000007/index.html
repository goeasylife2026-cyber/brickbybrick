        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Syne:wght@700;800&display=swap');
        
        * { box-sizing: border-box; }
        html, body { margin:0; padding:0; }
        
        .root {
          min-height: 100vh;
          background: #070709;
          color: #f5f5f7;
          font-family: "Inter", system-ui, -apple-system, sans-serif;
          display: flex;
          justify-content: center;
          padding: 32px 14px 48px;
          position: relative;
          overflow: hidden;
          -webkit-font-smoothing: antialiased;
        }

       .root::before {
         content:"";
         position: fixed;
          inset: 0;
          pointer-events: none;
          background:
            radial-gradient(60% 60% at 20% 10%, rgba(99,102,241,0.22) 0%, transparent 60%),
            radial-gradient(55% 55% at 85% 15%, rgba(236,72,153,0.18) 0%, transparent 55%),
            radial-gradient(45% 50% at 50% 85%, rgba(59,130,246,0.14) 0%, transparent 60%),
            radial-gradient(35% 35% at 10% 80%, rgba(168,85,247,0.12) 0%, transparent 60%);
          filter: blur(22px);
          z-index: 0;
        }
        .root::after {
          content:"";
          position: fixed;
          inset: 0;
          pointer-events: none;
          opacity: 0.045;
          z-index: 0;
          background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }
        .shell {
          width: 100%;
          max-width: 440px;
          position: relative;
          z-index: 1;
          animation: enter 0.9s cubic-bezier(.16,1,.3,1) both;
        }
        @keyframes enter {
          from { opacity:0; transform: translateY(18px) scale(0.98); }
          to { opacity:1; transform: translateY(0) scale(1); }
        }
        .card {
          background: linear-gradient(180deg, rgba(22,22,26,0.92) 0%, rgba(14,14,18,0.96) 100%);
          border: 1px solid rgba(255,255,255,0.09);
          border-radius: 36px;
          overflow: hidden;
          box-shadow: 
            0 0 0 1px rgba(255,255,255,0.04) inset,
            0 20px 60px rgba(0,0,0,0.55),
            0 1px 0 rgba(255,255,255,0.08) inset;
          backdrop-filter: blur(24px) saturate(1.2);
          position: relative;
        }
        .topbar {
          position: absolute;
          top: 14px;
          left: 14px;
          right: 14px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          z-index: 6;
        }
        .pill {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 7px 11px;
          border-radius: 100px;
          background: rgba(0,0,0,0.4);
          border: 1px solid rgba(255,255,255,0.12);
          backdrop-filter: blur(12px);
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 0.02em;
          color: rgba(255,255,255,0.78);
        }
        .pill dot {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: #22c55e;
          box-shadow: 0 0 10px #22c55e;
          display: inline-block;
        }
        .copy-btn {
          width: 36px;
          height: 36px;
          border-radius: 100px;
          border: 1px solid rgba(255,255,255,0.14);
          background: rgba(255,255,255,0.08);
          backdrop-filter: blur(12px);
          color: #fff;
          display: grid;
          place-items: center;
          cursor: pointer;
          transition: all 0.2s ease;
        }
        .copy-btn:hover { background: rgba(255,255,255,0.14); transform: translateY(-1px); }
        .copy-btn:active { transform: scale(0.96); }

       /* HERO CAROUSEL */
       .hero {
          height: 300px;
          position: relative;
          overflow: hidden;
          background: #0a0a0d;
          isolation: isolate;
          cursor: pointer;
          user-select: none;
        }
        .hero-slides {
          position: absolute;
          inset: 0;
          z-index: 0;
        }
        .hero-slide {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: center;
          opacity: 0;
          transition: opacity 800ms cubic-bezier(.4,0,.2,1);
          will-change: opacity;
          filter: saturate(1.05) contrast(1.08) brightness(1.02);
        }
        .hero-slide.active {
          opacity: 1;
        }
        .hero-slide.branding {
          object-position: center top;
        }
        .hero-slide.personal {
          object-position: center 20%;
        }
        .hero-dark {
          position: absolute;
          inset: 0;
          z-index: 1;
          background: linear-gradient(180deg, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.12) 32%, rgba(0,0,0,0.48) 76%, rgba(0,0,0,0.78) 100%);
          pointer-events: none;
        }
        .hero-dark-personal {
          background: linear-gradient(180deg, rgba(0,0,0,0.10) 0%, rgba(0,0,0,0.05) 40%, rgba(0,0,0,0.42) 78%, rgba(0,0,0,0.72) 100%);
        }
        .hero-glow {
          position: absolute;
          inset: 0;
          z-index: 2;
          pointer-events: none;
          background:
            radial-gradient(60% 50% at 18% 18%, rgba(99,102,241,0.18) 0%, transparent 55%),
            radial-gradient(55% 45% at 85% 20%, rgba(168,85,247,0.16) 0%, transparent 50%),
            radial-gradient(70% 60% at 50% 85%, rgba(56,189,248,0.12) 0%, transparent 60%);
          mix-blend-mode: screen;
          opacity: 0.85;
        }
        .hero-grid {
          position: absolute;
          inset: 0;
          background-image:
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
          background-size: 36px 36px;
          mask-image: radial-gradient(70% 60% at 50% 10%, black 20%, transparent 90%);
          opacity: 0.20;
          z-index: 2;
          pointer-events: none;
        }
        .hero-noise {
          position: absolute;
          inset: 0;
          opacity: 0.06;
          mix-blend-mode: soft-light;
          background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
          z-index: 2;
          pointer-events: none;
        }
        .hero-watermark {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 3;
          pointer-events: none;
          font-family: "Syne", "Space Grotesk", sans-serif;
          font-weight: 800;
          font-size: 84px;
          letter-spacing: -0.06em;
          color: rgba(255,255,255,0.04);
          transform: skewX(-10deg);
          user-select: none;
          opacity: 0;
          transition: opacity 800ms ease;
        }
        .hero-watermark.show {
          opacity: 1;
          color: rgba(255,255,255,0.045);
        }
        .hero-vignette {
          position: absolute;
          inset: 0;
          background: radial-gradient(85% 70% at 50% 25%, transparent 40%, rgba(0,0,0,0.40) 92%);
          z-index: 2;
          pointer-events: none;
        }
        .hero-dots {
          position: absolute;
          left: 50%;
          bottom: 18px;
          transform: translateX(-50%);
          z-index: 5;
          display: flex;
          align-items: center;
          gap: 6px;
          padding: 6px 10px;
          border-radius: 100px;
          background: rgba(0,0,0,0.36);
          border: 1px solid rgba(255,255,255,0.10);
          backdrop-filter: blur(12px);
        }
        .hero-dot {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: rgba(255,255,255,0.35);
          border: 0;
          padding: 0;
          cursor: pointer;
          transition: all 0.35s cubic-bezier(.16,1,.3,1);
        }
        .hero-dot.active {
          width: 20px;
          background: #fff;
          box-shadow: 0 0 10px rgba(255,255,255,0.4);
        }
        .hero-dot:hover { background: rgba(255,255,255,0.6); }
        .hero-dot.active:hover { background: #fff; }
        .hero-hint {
          position: absolute;
          right: 14px;
          bottom: 16px;
          z-index: 5;
          font-family: "Space Grotesk", sans-serif;
          font-size: 8.5px;
          letter-spacing: 0.18em;
          font-weight: 700;
          color: rgba(255,255,255,0.28);
          background: rgba(0,0,0,0.28);
